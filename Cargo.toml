[package]
name = "dgen-data"
version = "0.2.3"
edition = "2021"
authors = ["Russ Fellows <russ.fellows@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "High-performance random data generation with controllable deduplication and compression"
repository = "https://github.com/russfellows/dgen-rs"
readme = "README.md"
keywords = ["data", "generation", "benchmark", "performance", "numa"]
categories = ["development-tools::profiling", "algorithms"]

[lib]
name = "dgen_data"
crate-type = ["cdylib", "rlib"]  # cdylib for Python bindings, rlib for Rust usage

[[bench]]
name = "streaming-bench"
path = "benches/streaming_throughput.rs"
harness = false  # standalone benchmark with its own main(), not a criterion harness

[[example]]
name = "numa-test"
path = "examples/numa_test.rs"
required-features = ["numa"]

[[example]]
name = "small-object-bench"
path = "examples/small_object_bench.rs"
required-features = []

[[example]]
name = "rust-speed-probe"
path = "examples/rust_speed_probe.rs"
required-features = []

[[example]]
name = "speed-table"
path = "examples/speed_table.rs"
required-features = []

[[example]]
name = "bench-10gb"
path = "examples/bench_10gb.rs"
required-features = []

[dependencies]
# RNG and data generation
rand = { version = "0.9", features = ["std", "alloc"] }
rand_xoshiro = "0.7"  # Xoshiro256++ for high-performance RNG
rayon = "1.10"  # Parallel data generation
bytes = "^1.10"  # Zero-copy buffer type for Python integration

# PyO3 for Python bindings
# Note: The "abi3-py311" feature enables building a single wheel compatible 
#       with Python 3.11+ without recompilation, but it requires 
#      careful handling of C API usage to maintain compatibility.
# Therefore, for maximum compatibility, we use the "extension-module" feature
pyo3 = { version = "0.27", features = ["extension-module"], optional = true }

# NUMA topology detection and thread pinning
hwlocality = { version = "1.0.0-alpha.11", optional = true }
core_affinity = { version = "0.8", optional = true }
num_cpus = "1.16"  # Required for NUMA detection

# Logging
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Utilities
anyhow = "1.0"
thiserror = "1.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.20"

[features]
# Keep NUMA support opt-in to avoid hwloc/glibc runtime coupling in default wheels.
# thread-pinning requires numa: pinning threads to specific cores only makes sense
# when NUMA topology is available to determine which cores to pin to.
default = ["python-bindings"]
python-bindings = ["pyo3"]
numa = ["hwlocality", "thread-pinning"]  # thread-pinning is a sub-feature of numa
thread-pinning = ["core_affinity"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.bench]
inherits = "release"
